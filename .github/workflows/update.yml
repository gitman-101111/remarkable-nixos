name: update
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      koreader:
        description: "KoReader version (e.g. 2026.07.1); empty = newest stable"
        required: false
        default: ""

permissions:
  contents: write
  pull-requests: write

jobs:
  update:
    runs-on: ubuntu-24.04-arm
    env:
      KERNEL: .#nixosConfigurations.example-chiappa.config.boot.kernelPackages.kernel
    steps:
      - uses: actions/checkout@v7
      - uses: DeterminateSystems/nix-installer-action@v23

      - name: Point the koreader input at the newest stable release
        id: ko
        env:
          GH_TOKEN: ${{ github.token }}
          WANT: ${{ inputs.koreader }}
        run: |
          ver() { grep -oE 'koreader-remarkable-aarch64-v[0-9]{4}\.[0-9]{2}(\.[0-9]+)?\.zip' flake.nix | head -1 | grep -oE '[0-9]{4}\.[0-9]{2}(\.[0-9]+)?'; }
          before=$(ver)
          want="${WANT#v}"
          if [ -z "$want" ]; then
            want=$(gh api repos/koreader/koreader/releases/latest --jq '.tag_name' | sed 's/^v//')
          fi
          if [ "$want" != "$before" ]; then
            url="https://github.com/koreader/koreader/releases/download/v${want}/koreader-remarkable-aarch64-v${want}.zip"
            curl -fsSLI -o /dev/null "$url"
            sed -i "s|v${before}/koreader-remarkable-aarch64-v${before}\.zip|v${want}/koreader-remarkable-aarch64-v${want}.zip|" flake.nix
            grep -q "$url" flake.nix
          fi
          echo "before=$before" >> "$GITHUB_OUTPUT"
          echo "after=$want"    >> "$GITHUB_OUTPUT"

      - id: lock
        run: |
          kver() { nix eval --raw "$KERNEL.version"; }
          before=$(kver)
          nix flake update
          after=$(kver)
          echo "kernel_before=$before" >> "$GITHUB_OUTPUT"
          echo "kernel_after=$after"   >> "$GITHUB_OUTPUT"
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
          {
            echo 'summary<<EOF'
            git --no-pager diff --stat
            echo
            nix flake metadata --json | jq -r '.locks.nodes | to_entries[] | select(.value.locked != null) | "\(.key): \(.value.locked.rev // .value.locked.url) (\(.value.locked.lastModified | todate))"'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      - if: steps.lock.outputs.changed == 'true'
        run: nix eval --raw .#nixosConfigurations.example-chiappa.config.system.build.toplevel.drvPath

      - name: Kernel patch canary
        id: canary
        if: steps.lock.outputs.changed == 'true'
        run: |
          src=$(nix build --no-link --print-out-paths "$KERNEL.src")
          mkdir -p /tmp/k && tar -xf "$src" -C /tmp/k --strip-components=1
          ok=0; total=0; failed=""; fuzzy=""
          for p in $(nix eval --raw "$KERNEL.patches" --apply 'ps: builtins.concatStringsSep "\n" ps'); do
            total=$((total + 1))
            out=$(cd /tmp/k && patch -p1 -N --no-backup-if-mismatch < "$p" 2>&1) || true
            if echo "$out" | grep -qE 'FAILED|can.t find file|hunks? ignored'; then
              failed="$failed- $(basename "$p")"$'\n'"  $(echo "$out" | grep -m1 -E 'FAILED|can.t find file|ignored')"$'\n'
            else
              ok=$((ok + 1))
              if echo "$out" | grep -q 'fuzz'; then
                fuzzy="$fuzzy- $(basename "$p"): $(echo "$out" | grep -c fuzz) hunk(s) with fuzz"$'\n'
              fi
            fi
          done
          echo "ok=$ok" >> "$GITHUB_OUTPUT"
          echo "total=$total" >> "$GITHUB_OUTPUT"
          {
            echo 'report<<EOF'
            if [ -z "$failed" ]; then
              echo "all $total patches apply to ${{ steps.lock.outputs.kernel_after }}"
            else
              echo "$ok/$total patches apply to ${{ steps.lock.outputs.kernel_after }}; failing:"
              printf '%s' "$failed"
            fi
            if [ -n "$fuzzy" ]; then
              echo "applied with fuzz (verify placement):"
              printf '%s' "$fuzzy"
            fi
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # `make oldconfig` silently drops options the new source no longer defines.
      - name: Kernel config canary
        id: config
        if: steps.lock.outputs.changed == 'true'
        run: |
          cfg=$(nix build --no-link --print-out-paths "$KERNEL.configfile")
          find /tmp/k -name 'Kconfig*' -print0 \
            | xargs -0 grep -hoE '^[[:space:]]*(menu)?config[[:space:]]+[A-Z0-9_]+' \
            | awk '{print $2}' | sort -u > /tmp/defined
          grep -oE '^CONFIG_[A-Z0-9_]+=[ym]' "$cfg" | sed 's/^CONFIG_//; s/=.*//' | sort -u > /tmp/enabled
          missing=$(comm -23 /tmp/enabled /tmp/defined)
          if [ -z "$missing" ]; then
            echo "report=every enabled option is still defined on ${{ steps.lock.outputs.kernel_after }}" >> "$GITHUB_OUTPUT"
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            {
              echo 'report<<EOF'
              echo "enabled options no longer defined on ${{ steps.lock.outputs.kernel_after }} (dropped silently by oldconfig; a failing patch's own symbols also land here):"
              echo "$missing" | sed 's/^/- CONFIG_/'
              echo 'EOF'
            } >> "$GITHUB_OUTPUT"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.lock.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: update/inputs
          delete-branch: true
          commit-message: "flake: update inputs (koreader ${{ steps.ko.outputs.after }}, kernel ${{ steps.lock.outputs.kernel_after }})"
          title: "flake: update inputs (koreader ${{ steps.ko.outputs.after }}, kernel ${{ steps.lock.outputs.kernel_after }}${{ (steps.canary.outputs.ok != steps.canary.outputs.total || steps.config.outputs.ok == 'false') && ' — KERNEL CANARY FAILS' || '' }})"
          body: |
            Weekly input refresh.

            - KoReader: **${{ steps.ko.outputs.before }} → ${{ steps.ko.outputs.after }}**
              (https://github.com/koreader/koreader/releases/tag/v${{ steps.ko.outputs.after }})
            - Kernel (nixpkgs `linux_latest`): **${{ steps.lock.outputs.kernel_before }} → ${{ steps.lock.outputs.kernel_after }}**
            - Patch canary: ${{ steps.canary.outputs.report }}
            - Config canary: ${{ steps.config.outputs.report }}
            - `nix flake update` for nixpkgs and chiappa

            ```
            ${{ steps.lock.outputs.summary }}
            ```

            The reference config evaluated on an arm64 runner; nothing was built or booted. A kernel bump needs a local build and a device test before merging; a failing canary needs chiappa's series rebased (or its config updated) first.
